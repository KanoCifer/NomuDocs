name: Deploy Docs

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm run docs:build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github-actions
          chmod 600 ~/.ssh/github-actions
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync dist to remote
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          rsync -az --delete \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/github-actions -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" \
            .vitepress/dist/ \
            "${SSH_USER}@${SSH_HOST}:/home/kano/NomuDocs/docs/"

      - name: Deployment complete
        if: success()
        run: |
          echo "========================================"
          echo "  ✅ Docs Deploy Completed"
          echo "  📅 $(date -u)"
          echo "========================================"
